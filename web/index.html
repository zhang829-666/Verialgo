<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verialgo · 算法代码智能体</title>
<style>
  :root{
    --bg:#F7F7F4; --panel:#FFFFFF; --line:#E6E5DF; --line-soft:#EFEEE9;
    --text:#23231F; --muted:#74736B; --faint:#A8A79E;
    --accent:#534AB7; --accent-bg:#EEEDFE; --accent-deep:#3C3489;
    --ok:#0F6E56; --ok-bg:#E1F5EE;
    --err:#A32D2D; --err-bg:#FCEBEB;
    --code-bg:#FBFBF8;
    --mono:"Cascadia Code",Consolas,"SF Mono","Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 14px;transition:background .15s,border-color .15s}
  button:hover:not(:disabled){border-color:var(--faint)}
  button:disabled{opacity:.5;cursor:default}

  .app{display:flex;flex-direction:column;height:100vh}

  header{
    display:flex;align-items:center;justify-content:space-between;
    height:56px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand b{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .brand .sub{font-size:12px;color:var(--muted)}
  .meta{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted)}
  .chip{background:var(--line-soft);border-radius:6px;padding:3px 9px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .conn{display:flex;align-items:center;gap:6px}
  .conn i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
  .conn.on i{background:var(--ok)}
  .conn.bad i{background:var(--err)}

  main{display:grid;grid-template-columns:1fr 296px;flex:1 1 auto;min-height:0}
  .left{display:flex;flex-direction:column;min-height:0;padding:18px 20px}
  .right{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}

  .composer{background:var(--panel);border:1px solid var(--line);border-radius:12px;flex:0 0 auto;transition:border-color .15s}
  .composer:focus-within{border-color:var(--accent)}
  textarea{
    width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--text);
    font:14px/1.65 inherit;padding:14px 16px 6px;min-height:74px;max-height:220px;
  }
  textarea::placeholder{color:var(--faint)}
  .composer-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 10px 16px;gap:12px}
  .seeds{display:flex;gap:6px;flex-wrap:wrap}
  .seed{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:12px;padding:4px 10px;border-radius:14px}
  .seed:hover{border-color:var(--accent);color:var(--accent-deep);background:var(--accent-bg)}
  #run{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500;padding:7px 20px}
  #run:hover:not(:disabled){background:var(--accent-deep);border-color:var(--accent-deep)}

  .timeline{flex:1 1 auto;overflow-y:auto;margin-top:18px;padding-right:4px;scroll-behavior:smooth}
  .empty{color:var(--faint);font-size:13px;padding:32px 2px;text-align:center;line-height:2}

  .step-row{display:flex;align-items:center;gap:10px;margin:14px 0 10px;font-size:12px;color:var(--faint)}
  .step-row::after{content:"";flex:1;height:1px;background:var(--line-soft)}
  .step-row .timer{font-family:var(--mono);color:var(--accent)}

  .thought{position:relative;margin:0 0 10px 0;padding:2px 0 2px 16px;font-size:13px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
  .thought::before{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:2px;border-radius:1px;background:var(--line)}

  .tool{
    display:flex;align-items:flex-start;gap:10px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px;
  }
  .tool .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);margin-top:7px;flex:0 0 auto}
  .tool.pending .dot{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
  .tool.ok .dot{background:var(--ok)}
  .tool.fail .dot{background:var(--err)}
  .tool .body{min-width:0;flex:1}
  .tool .name{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--text)}
  .tool .hint{font-family:var(--mono);font-size:12px;color:var(--accent-deep);margin-left:8px;font-weight:400}
  .tool .summary{font-size:12.5px;color:var(--muted);margin-top:2px;word-break:break-word}
  .tool.fail .summary{color:var(--err)}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  .final{background:var(--accent-bg);border:1px solid #DCD9FA;border-radius:12px;padding:14px 16px;margin-top:14px;font-size:13.5px;line-height:1.75}
  .final h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--accent-deep);letter-spacing:.02em}
  .final p{margin:0 0 6px}
  .final ul{margin:4px 0 6px;padding-left:18px}
  .final li{margin:2px 0}
  .final code{font-family:var(--mono);font-size:12px;background:#fff;border:1px solid #DCD9FA;border-radius:4px;padding:1px 4px}
  .final b{font-weight:600}

  .error-box{background:var(--err-bg);border:1px solid #F2C9C9;border-radius:10px;padding:12px 14px;margin-top:12px;color:var(--err);font-size:13px}

  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;font-size:12px;color:var(--muted);letter-spacing:.02em}
  .panel-head button{padding:3px 9px;font-size:12px}
  .filelist{list-style:none;margin:0;padding:0 8px 16px;overflow-y:auto;flex:1}
  .filelist li{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:7px;cursor:pointer;font-family:var(--mono);font-size:12.5px}
  .filelist li:hover{background:var(--line-soft)}
  .filelist li .sz{color:var(--faint);font-size:11px;flex:0 0 auto}
  .filelist .none{color:var(--faint);font-size:12.5px;font-family:inherit;padding:10px;cursor:default}
  .filelist .none:hover{background:transparent}

  .viewer{position:fixed;inset:0;background:rgba(35,35,31,.32);display:flex;align-items:center;justify-content:center;padding:32px;z-index:50}
  .viewer[hidden]{display:none}
  .viewer-panel{background:var(--panel);border-radius:12px;width:min(920px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
  .viewer-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px}
  pre.code{margin:0;overflow:auto;background:var(--code-bg);padding:12px 0;font-family:var(--mono);font-size:12.5px;line-height:1.7}
  .cl{display:block;white-space:pre;padding:0 16px 0 0}
  .ln{display:inline-block;width:3.4em;padding-right:.8em;text-align:right;color:var(--faint);user-select:none}
  .kw{color:#7C3AED}
  .str{color:#0F6E56}
  .cmt{color:#9A9A90;font-style:italic}
  .num{color:#B45309}

  @media (max-width:820px){
    main{grid-template-columns:1fr}
    .right{display:none}
    .left{padding:14px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><b>Verialgo</b><span class="sub">算法代码智能体</span></div>
    <div class="meta">
      <span class="chip" id="model">加载中</span>
      <span class="conn" id="conn"><i></i><span>检查中</span></span>
    </div>
  </header>

  <main>
    <section class="left">
      <div class="composer">
        <textarea id="task" rows="2" placeholder="描述你要实现的算法，越具体越好。例如：实现一个支持区间加和区间求和的线段树，要求 O(log n)"></textarea>
        <div class="composer-bar">
          <div class="seeds">
            <button class="seed" data-t="实现一个 LRU 缓存，要求 get 和 put 都是 O(1)，并写测试">LRU 缓存</button>
            <button class="seed" data-t="实现 Dijkstra 最短路算法，支持稀疏图，返回路径而不仅是距离">Dijkstra</button>
            <button class="seed" data-t="实现一个支持区间加和区间求和的线段树，带懒标记">线段树</button>
          </div>
          <button id="run">运行</button>
        </div>
      </div>

      <div class="timeline" id="timeline">
        <div class="empty">还没有任务。<br>写一个算法需求，回车或者点「运行」，它会自己写代码、执行、改错，直到跑通。</div>
      </div>
    </section>

    <aside class="right">
      <div class="panel-head">
        <span>产物文件</span>
        <button id="refresh">刷新</button>
      </div>
      <ul class="filelist" id="files"></ul>
    </aside>
  </main>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="viewer-panel">
    <div class="viewer-head">
      <span id="viewer-title"></span>
      <button id="viewer-close">关闭</button>
    </div>
    <pre class="code" id="viewer-code"></pre>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const ta = $('#task'), runBtn = $('#run'), timeline = $('#timeline');
const state = { running: false, source: null, pending: [], stepRow: null, timer: null };

/* ---------- 基础工具 ---------- */

function node(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function clearTimeline() {
  timeline.innerHTML = '';
}

function scrollDown() {
  timeline.scrollTop = timeline.scrollHeight;
}

/* ---------- 时间线渲染 ---------- */

function addStep(n, total) {
  const row = node('div', 'step-row');
  row.appendChild(node('span', '', `第 ${n} 步 / 共 ${total}`));
  const timer = node('span', 'timer', '');
  row.appendChild(timer);
  timeline.appendChild(row);
  state.stepRow = timer;
  state.timer = null;
  scrollDown();
}

function addThought(text) {
  if (!text || !text.trim()) return;
  const block = node('div', 'thought');
  block.textContent = text.trim();
  timeline.appendChild(block);
  scrollDown();
}

function addToolStart(name, hint) {
  const card = node('div', 'tool pending');
  card.appendChild(node('div', 'dot'));
  const body = node('div', 'body');
  const head = node('div', '');
  head.appendChild(node('span', 'name', name));
  if (hint) head.appendChild(node('span', 'hint', hint));
  body.appendChild(head);
  body.appendChild(node('div', 'summary', '执行中…'));
  card.appendChild(body);
  timeline.appendChild(card);
  state.pending.push({ card, body });
  scrollDown();
}

function addToolEnd(ev) {
  const item = state.pending.shift();
  if (!item) return;
  item.card.classList.remove('pending');
  item.card.classList.add(ev.ok ? 'ok' : 'fail');
  const summary = item.body.querySelector('.summary');
  if (summary) summary.textContent = ev.summary || (ev.ok ? '完成' : '失败');
  scrollDown();
}

function addFinal(text, steps, elapsed) {
  const box = node('div', 'final');
  box.appendChild(node('h4', '', `交付完成 · ${steps} 步 · ${elapsed} 秒`));
  box.appendChild(renderMarkdown(text || ''));
  timeline.appendChild(box);
  scrollDown();
}

function addError(msg) {
  const box = node('div', 'error-box', msg);
  timeline.appendChild(box);
  scrollDown();
}

function renderMarkdown(text) {
  const frag = document.createDocumentFragment();
  const lines = String(text).split('\n');
  let list = null;

  const inline = (raw) => {
    let html = esc(raw);
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return html;
  };

  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) { list = null; continue; }
    if (/^[-*]\s+/.test(trimmed)) {
      if (!list) { list = node('ul'); frag.appendChild(list); }
      const li = node('li');
      li.innerHTML = inline(trimmed.replace(/^[-*]\s+/, ''));
      list.appendChild(li);
      continue;
    }
    list = null;
    const p = node('p');
    p.innerHTML = inline(trimmed);
    frag.appendChild(p);
  }
  return frag;
}

/* ---------- 事件分发 ---------- */

function handle(ev) {
  switch (ev.type) {
    case 'step':
      addStep(ev.step, ev.total);
      break;
    case 'wait':
      if (state.stepRow) {
        state.stepRow.textContent = `已等待 ${ev.elapsed}s`;
      }
      break;
    case 'thought':
      addThought(ev.text);
      break;
    case 'tool_start':
      addToolStart(ev.name, ev.hint);
      break;
    case 'tool_end':
      addToolEnd(ev);
      break;
    case 'final':
      addFinal(ev.text, ev.steps, ev.elapsed);
      break;
    case 'error':
      addError(ev.message || '未知错误');
      break;
  }
}

/* ---------- 运行与流 ---------- */

async function run() {
  const task = ta.value.trim();
  if (!task || state.running) return;

  clearTimeline();
  state.pending = [];
  state.running = true;
  runBtn.disabled = true;
  runBtn.textContent = '运行中';

  try {
    const resp = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task })
    });
    const data = await resp.json();
    if (data.error) { addError(data.error); finish(); return; }
    connect(data.task_id);
  } catch (err) {
    addError('无法连接本地服务：' + err.message);
    finish();
  }
}

function connect(taskId) {
  if (state.source) state.source.close();
  const source = new EventSource('/api/stream?id=' + encodeURIComponent(taskId));
  state.source = source;

  source.onmessage = (e) => {
    try { handle(JSON.parse(e.data)); } catch (_) {}
  };
  let done = false;
  source.addEventListener('end', () => {
    done = true;
    source.close();
    finish();
  });
  source.onerror = () => {
    if (done) return;
    if (source.readyState === EventSource.CLOSED) {
      done = true;
      addError('与本地服务的连接中断了，任务可能还在后台运行。');
      finish();
    }
  };
}

function finish() {
  state.running = false;
  state.stepRow = null;
  runBtn.disabled = false;
  runBtn.textContent = '运行';
  if (state.source) { state.source.close(); state.source = null; }
  loadFiles();
}

/* ---------- 文件面板 ---------- */

async function loadFiles() {
  const list = $('#files');
  try {
    const resp = await fetch('/api/files');
    const data = await resp.json();
    list.innerHTML = '';
    if (!data.files || !data.files.length) {
      list.appendChild(node('li', 'none', '工作区还是空的'));
      return;
    }
    for (const f of data.files) {
      const li = node('li');
      li.appendChild(node('span', '', f.path));
      li.appendChild(node('span', 'sz', (f.size / 1024).toFixed(1) + 'k'));
      li.addEventListener('click', () => openFile(f.path));
      list.appendChild(li);
    }
  } catch (err) {
    list.innerHTML = '';
    list.appendChild(node('li', 'none', '读取失败'));
  }
}

/* ---------- 代码查看 ---------- */

const KEYWORDS = ['def','class','return','if','elif','else','for','while','in','not','and','or',
  'import','from','as','with','try','except','finally','raise','lambda','yield','None','True',
  'False','assert','pass','break','continue','global','nonlocal','is','async','await','del'];

const KW_RE = new RegExp('\\b(' + KEYWORDS.join('|') + ')\\b', 'g');

function findComment(line) {
  let quote = null;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (quote) {
      if (c === '\\') i++;
      else if (c === quote) quote = null;
    } else if (c === '"' || c === "'") {
      quote = c;
    } else if (c === '#') {
      return i;
    }
  }
  return -1;
}

function highlight(line) {
  let code = line, comment = '';
  const at = findComment(line);
  if (at >= 0) { code = line.slice(0, at); comment = line.slice(at); }

  const strings = [];
  let html = esc(code).replace(/('[^']*'|"[^"]*")/g, (m) => {
    strings.push(m);
    return '\u0000' + (strings.length - 1) + '\u0000';
  });
  html = html.replace(KW_RE, '<span class="kw">$1</span>');
  html = html.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="num">$1</span>');
  html = html.replace(/\u0000(\d+)\u0000/g, (_, i) => '<span class="str">' + strings[+i] + '</span>');
  if (comment) html += '<span class="cmt">' + esc(comment) + '</span>';
  return html;
}

async function openFile(path) {
  try {
    const resp = await fetch('/api/file?path=' + encodeURIComponent(path));
    const data = await resp.json();
    if (data.error) return;
    $('#viewer-title').textContent = data.path;
    const lines = data.content.split('\n');
    const width = String(lines.length).length;
    $('#viewer-code').innerHTML = lines.map((line, i) => {
      const num = String(i + 1).padStart(width, ' ');
      return '<span class="cl"><span class="ln">' + num + '</span>' + (highlight(line) || ' ') + '</span>';
    }).join('\n');
    $('#viewer').hidden = false;
  } catch (err) {}
}

/* ---------- 启动 ---------- */

async function loadStatus() {
  const conn = $('#conn');
  try {
    const resp = await fetch('/api/status');
    const data = await resp.json();
    $('#model').textContent = data.model;
    conn.className = 'conn' + (data.has_key ? ' on' : ' bad');
    conn.querySelector('span').textContent = data.has_key ? '就绪' : '缺少密钥';
  } catch (err) {
    conn.className = 'conn bad';
    conn.querySelector('span').textContent = '离线';
  }
}

runBtn.addEventListener('click', run);

ta.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    run();
  }
});

ta.addEventListener('input', () => {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 220) + 'px';
});

document.querySelectorAll('.seed').forEach((btn) => {
  btn.addEventListener('click', () => {
    ta.value = btn.dataset.t;
    ta.focus();
    ta.dispatchEvent(new Event('input'));
  });
});

$('#refresh').addEventListener('click', loadFiles);
$('#viewer-close').addEventListener('click', () => { $('#viewer').hidden = true; });
$('#viewer').addEventListener('click', (e) => {
  if (e.target.id === 'viewer') $('#viewer').hidden = true;
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') $('#viewer').hidden = true;
});

loadStatus();
loadFiles();
ta.focus();
</script>
</body>
</html>
